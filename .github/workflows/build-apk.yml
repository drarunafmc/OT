name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Find project folder
        run: |
          F=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          echo "Found: $F"
          echo "APP_DIR=$(dirname "$F")" >> $GITHUB_ENV
      - run: npm install
        working-directory: ${{ env.APP_DIR }}
      - run: npx cap sync android
        working-directory: ${{ env.APP_DIR }}
      - run: chmod +x android/gradlew
        working-directory: ${{ env.APP_DIR }}
      - run: ./gradlew assembleDebug
        working-directory: ${{ env.APP_DIR }}/android
      - uses: actions/upload-artifact@v4
        with:
          name: OT-Planner-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
